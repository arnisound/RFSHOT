name: Déploiement GitHub Pages

on:
  push:
    branches:
      - main
      - claude/sleepy-carson-vsif2w
      - claude/busy-meitner-bksw5c
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build obfusqué (le moteur n'est pas lisible sur le site publié)
        run: |
          npm i --no-save javascript-obfuscator@4
          node tools/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
